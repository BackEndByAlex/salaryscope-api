# ---------------------------------------------------------------
# SalaryScope CI/CD Pipeline
# TEST → BUILD
#
# Deployment is handled by Watchtower on the server —
# it polls the registry and auto-updates the API container.
# ---------------------------------------------------------------

stages:
  - test
  - build

# ---------------------------------------------------------------
# TEST — Run Newman against the live API
# Runs on main only (tests mutate production data)
# ---------------------------------------------------------------
test:
  stage: test
  image:
    name: postman/newman:latest
    entrypoint: [""]
  script:
    - newman run postman/salary-api.postman_collection.json
        -e postman/production.postman_environment.json
        --insecure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------
# BUILD — Build Docker image and push to GitLab Container Registry
# Uses Kaniko (no privileged mode needed on shared runners)
# Runs on main only, after tests pass
# ---------------------------------------------------------------
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}"
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:latest"
        --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------
# BUILD DOCS — Build Docusaurus image and push to GitLab Registry
# ---------------------------------------------------------------
build-docs:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}"
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile.docs"
        --destination "${CI_REGISTRY_IMAGE}/docs:${CI_COMMIT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}/docs:latest"
        --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

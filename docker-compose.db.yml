# Migrate + seed — run once after the server compose is up.
#
# Prerequisites:
#   - Postgres already running on salaryscope-network (from server compose)
#   - CSV files in ./data/
#
# Run:
#   docker compose -f docker-compose.db.yml up
#
# Re-seed later:
#   docker compose -f docker-compose.db.yml run --rm seed

services:
  migrate:
    build: .
    restart: "no"
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - app-network

  seed:
    build: .
    restart: "no"
    command: node prisma/seed.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: salaryscope-network

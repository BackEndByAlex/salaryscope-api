# Local development — API only.
# Requires the database to be running: docker compose -f docker-compose.db.yml up -d
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: development
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./keys:/app/keys:ro
      - ./src:/app/src
    command: node --watch src/server.js
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: salaryscope-network

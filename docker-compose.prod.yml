# Production API — redeployed by CI/CD on every push.
# Requires the database to be running: docker compose -f docker-compose.db.yml up -d
#
# Deploy:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  api:
    build: .
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PRIVATE_KEY_PATH: /run/secrets/private_key
    secrets:
      - source: private_key
        mode: 0444
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    networks:
      - app-network

secrets:
  private_key:
    file: ./keys/private.pem

networks:
  app-network:
    external: true
    name: salaryscope-network

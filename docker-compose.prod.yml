# Production API + Caddy reverse proxy.
# Requires the database to be running: docker compose -f docker-compose.db.yml up -d
#
# Deploy:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:/etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:ro
    networks:
      - app-network

  api:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PRIVATE_KEY_PATH: /run/secrets/private_key
    secrets:
      - source: private_key
        mode: 0444
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    networks:
      - app-network

secrets:
  private_key:
    file: ./keys/private.pem

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    external: true
    name: salaryscope-network

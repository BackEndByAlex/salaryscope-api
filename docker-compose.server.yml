# Server-side compose — runs on the production server only.
# Does NOT require the project repo to be cloned.
#
# Prerequisites:
#   - RSA keys at /home/ubuntu/keys/private.pem and public.pem
#   - Caddyfile in the same folder as this file
#   - .env in the same folder with POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, ALLOWED_ORIGINS
#   - GitLab registry credentials in ~/.docker/config.json
#
# First-time setup:
#   cd ~/salaryscope && docker compose up -d
#   Then clone the project to /tmp, run docker-compose.db.yml to migrate and seed.
#
# Day-to-day:
#   cd ~/salaryscope && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:/etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:ro
    depends_on:
      - api
      - docs
    networks:
      - app-network

  api:
    image: gitlab.lnu.se:5050/1dv027/student/aa227wr/exercises/assignment-api-design:latest
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PRIVATE_KEY_PATH: /run/secrets/private_key
    secrets:
      - source: private_key
        mode: 0400
    volumes:
      - /home/ubuntu/keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  docs:
    image: gitlab.lnu.se:5050/1dv027/student/aa227wr/exercises/assignment-api-design/docs:latest
    container_name: salaryscope-docs
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - app-network

  watchtower:
    image: nickfedor/watchtower
    restart: always
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json:ro
    networks:
      - app-network

secrets:
  private_key:
    file: /home/ubuntu/keys/private.pem

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    name: salaryscope-network

# Server-side compose — runs on the production server only.
# Does NOT require the project repo to be cloned.
#
# Prerequisites:
#   - Postgres already running on salaryscope-network (from docker-compose.db.yml)
#   - RSA keys at ~/keys/private.pem and ~/keys/public.pem
#   - Caddyfile in the same folder as this file
#   - .env in the same folder with POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, ALLOWED_ORIGINS
#   - GitLab registry credentials in ~/.docker/config.json
#
# Deploy:
#   cd ~/salaryscope && docker compose up -d
#
# The API image is pulled from GitLab registry — Watchtower auto-updates it.

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:/etc/ssl/certs/LNU_FTK_Campus_Root_CA_2025.pem:ro
    networks:
      - app-network

  api:
    image: gitlab.lnu.se:5050/1dv027/student/aa227wr/exercises/assignment-api-design:latest
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PRIVATE_KEY_PATH: /run/secrets/private_key
    secrets:
      - source: private_key
        mode: 0400
    volumes:
      - /home/ubuntu/keys/public.pem:/app/keys/public.pem:ro
    networks:
      - app-network

  watchtower:
    image: nickfedor/watchtower
    restart: always
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json:ro
    networks:
      - app-network

secrets:
  private_key:
    file: /home/ubuntu/keys/private.pem

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    external: true
    name: salaryscope-network

# VPS deployment — backendbyalex.nu
#
# Differences from docker-compose.prod.yml:
#   - Caddy is NOT here (system Caddy on the VPS handles TLS + routing)
#   - API image is built from source (no GitLab registry needed)
#   - API port is bound to 127.0.0.1 only — never exposed to the public internet
#   - Keys are relative to the project directory (./keys/)
#
# Prerequisites (run once):
#   1. mkdir -p ~/salaryscope/keys
#   2. openssl genrsa -out ~/salaryscope/keys/private.pem 4096
#   3. openssl rsa -in ~/salaryscope/keys/private.pem -pubout -out ~/salaryscope/keys/public.pem
#   4. Copy .env.example to .env and fill in all values
#   5. Add the backendbyalex.nu block from Caddyfile.vps to /etc/caddy/Caddyfile
#   6. systemctl reload caddy
#
# First-time start:
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker compose -f docker-compose.db.yml up        # migrate + seed
#
# Updates:
#   git pull
#   docker compose -f docker-compose.vps.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: salaryscope-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: salaryscope-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  api-docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    container_name: salaryscope-api-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salaryscope-api
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PRIVATE_KEY_PATH: /run/secrets/private_key
      ELASTICSEARCH_URL: http://elasticsearch:9200
      GROQ_API_KEY: ${GROQ_API_KEY}
      COOKIE_SECRET: ${COOKIE_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    secrets:
      - source: private_key
        mode: 0400
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - app-network

secrets:
  private_key:
    file: ./keys/private.pem

volumes:
  postgres_data:
  elasticsearch_data:

networks:
  app-network:
    name: salaryscope-network

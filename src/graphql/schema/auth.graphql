type User {
  """
  Unique user ID.
  """
  id: ID!

  """
  The user's email address.
  """
  email: String!

  """
  When the account was created.
  """
  createdAt: String!

  """
  Whether this account has a GitHub OAuth connection.
  """
  githubConnected: Boolean!

  """
  Whether this account has a Google OAuth connection.
  """
  googleConnected: Boolean!

  """
  Salary records created by this user.
  """
  salaryRecords: [SalaryRecord!]!
}

type AuthPayload {
  """
  The authenticated user. The JWT is delivered exclusively via HttpOnly cookie — it is not returned in the response body.
  """
  user: User!
}

input RegisterInput {
  """
  Email address for the new account. Must be unique.
  """
  email: String!

  """
  Password for the new account. Minimum 8 characters.
  """
  password: String!
}

input LoginInput {
  """
  The registered email address.
  """
  email: String!

  """
  The account password.
  """
  password: String!
}

extend type Query {
  """
  Returns the currently authenticated user. Requires a valid Bearer token.
  """
  me: User
}

"""
Input for initiating an OAuth flow. The client provides its PKCE code challenge;
the server generates the state and returns the full provider authorization URL.
"""
input BeginOAuthInput {
  """
  The PKCE code challenge (S256) derived from the client-generated code verifier.
  """
  codeChallenge: String!
}

"""
Returned by beginGoogleLogin / beginGithubLogin.
Redirect the user's browser to authUrl to start the OAuth flow.
"""
type BeginOAuthPayload {
  """
  The full provider authorization URL including state and PKCE code_challenge.
  """
  authUrl: String!
}

input GoogleLoginInput {
  """
  The authorization code received from Google's OAuth callback.
  """
  code: String!

  """
  The PKCE code verifier generated by the client before the OAuth redirect.
  """
  codeVerifier: String!

  """
  The state value returned by the provider in the OAuth callback.
  The server verifies this against a signed cookie set during beginGoogleLogin.
  """
  state: String!
}

input GitHubLoginInput {
  """
  The authorization code received from GitHub's OAuth callback.
  """
  code: String!

  """
  The PKCE code verifier generated by the client before the OAuth redirect.
  """
  codeVerifier: String!

  """
  The state value returned by the provider in the OAuth callback.
  The server verifies this against a signed cookie set during beginGithubLogin.
  """
  state: String!
}

extend type Mutation {
  """
  Register a new account. Returns a JWT token valid for 24 hours.
  """
  register(input: RegisterInput!): AuthPayload!

  """
  Log in with email and password. Returns a JWT token valid for 24 hours.
  """
  login(input: LoginInput!): AuthPayload!

  """
  Step 1 of Google OAuth: generates a server-side state, sets a signed HttpOnly cookie,
  and returns the full Google authorization URL to redirect the user to.
  """
  beginGoogleLogin(input: BeginOAuthInput!): BeginOAuthPayload!

  """
  Step 2 of Google OAuth: verifies the state cookie, exchanges the code, and returns a JWT.
  """
  googleLogin(input: GoogleLoginInput!): AuthPayload!

  """
  Step 1 of GitHub OAuth: generates a server-side state, sets a signed HttpOnly cookie,
  and returns the full GitHub authorization URL to redirect the user to.
  """
  beginGithubLogin(input: BeginOAuthInput!): BeginOAuthPayload!

  """
  Step 2 of GitHub OAuth: verifies the state cookie, exchanges the code, and returns a JWT.
  """
  githubLogin(input: GitHubLoginInput!): AuthPayload!

  """
  Log out the current user. Clears the HttpOnly auth cookie server-side. Returns true on success.
  """
  logout: Boolean!
}

type Job {
  """
  Unique job ID.
  """
  id: ID!

  """
  Job title (e.g. "Machine Learning Engineer").
  """
  title: String!

  """
  The job category this job belongs to, if any.
  """
  category: JobCategory

  """
  Alternative role names for this job. Present only for salary_extra and software_pro records.
  """
  roles: String

  """
  Paginated salary records for this job title.
  """
  records(limit: Int, offset: Int): SalaryRecordPage!
}

type JobPage {
  """
  The jobs in this page.
  """
  jobs: [Job!]!

  """
  Total number of jobs matching the query.
  """
  totalCount: Int!

  """
  Whether there are more jobs after this page.
  """
  hasNextPage: Boolean!
}

extend type Query {
  """
  Returns a paginated list of jobs, optionally filtered by category.
  """
  jobs(categoryId: ID, limit: Int, offset: Int): JobPage!

  """
  Returns a single job by its numeric ID.
  """
  job(id: ID!): Job!
}

type JobCategory {
  """
  Unique category ID.
  """
  id: ID!

  """
  Category name (e.g. "Data Science and Research").
  """
  name: String!

  """
  Number of jobs in this category. Null when the category is loaded as a nested relation.
  """
  jobCount: Int
}

type JobCategoryPage {
  """
  The job categories in this page.
  """
  jobCategories: [JobCategory!]!

  """
  Total number of job categories matching the query.
  """
  totalCount: Int!

  """
  Whether there are more categories after this page.
  """
  hasNextPage: Boolean!
}

extend type Query {
  """
  Returns a paginated list of job categories.
  """
  jobCategories(limit: Int, offset: Int): JobCategoryPage!

  """
  Returns a single job category by its numeric ID.
  """
  jobCategory(id: ID!): JobCategory!

  """
  Returns a single job category by its exact name.
  """
  jobCategoryByName(name: String!): JobCategory!
}

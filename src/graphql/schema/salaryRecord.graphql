type SalaryRecord {
  """
  Unique salary record ID.
  """
  id: ID!

  """
  The reported salary amount.
  """
  salary: Float!

  """
  Which dataset this record came from: jobs_in_data, salary_extra, or software_pro.
  """
  source: String!

  """
  USD-normalised salary. Present only for jobs_in_data records.
  """
  salaryInUsd: Float

  """
  Original currency code. Present only for jobs_in_data records.
  """
  salaryCurrency: String

  """
  Year the salary data was collected (e.g. 2023). Present only for jobs_in_data records.
  """
  workYear: Int

  """
  Experience level: SE (senior), MI (mid), EN (entry), EX (executive).
  """
  experienceLevel: String

  """
  Employment type: FT (full-time), PT (part-time), CT (contract), FL (freelance).
  """
  employmentType: String

  """
  Work setting: Remote, Hybrid, or In-person.
  """
  workSetting: String

  """
  Company size: S (small), M (medium), L (large).
  """
  companySize: String

  """
  Number of salary responses aggregated into this record. Present only for salary_extra and software_pro records.
  """
  salariesReported: Int

  """
  Employment status. Present only for salary_extra records.
  """
  employmentStatus: String

  """
  The job this salary record belongs to.
  """
  job: Job!

  """
  The country where the employee is located.
  """
  employeeCountry: Country

  """
  The country where the company is located.
  """
  companyCountry: Country

  """
  The company this salary record belongs to.
  """
  company: Company

  """
  The city where this salary record is located.
  """
  city: City

  """
  When this record was created.
  """
  createdAt: String!

  """
  When this record was last updated.
  """
  updatedAt: String!
}

type SalaryRecordPage {
  """
  The salary records in this page.
  """
  records: [SalaryRecord!]!

  """
  Total number of salary records matching the query.
  """
  totalCount: Int!

  """
  Whether there are more records after this page.
  """
  hasNextPage: Boolean!
}

input SalaryRecordFilters {
  """
  Max records to return. Default 20, max 100.
  """
  limit: Int

  """
  Number of records to skip for pagination.
  """
  offset: Int

  """
  Filter by job ID.
  """
  jobId: ID

  """
  Filter by job category ID.
  """
  categoryId: ID

  """
  Filter by employee country ID.
  """
  countryId: ID

  """
  Filter by company ID.
  """
  companyId: ID

  """
  Filter by city ID.
  """
  cityId: ID

  """
  Filter by data source: jobs_in_data | salary_extra | software_pro | h1b_visa
  """
  source: String

  """
  Filter by work year (e.g. 2023).
  """
  workYear: Int

  """
  Filter by experience level (e.g. SE, MI, EN, EX).
  """
  experienceLevel: String

  """
  Filter by employment type (e.g. FT, PT, CT, FL).
  """
  employmentType: String

  """
  Filter by work setting (e.g. Remote, Hybrid, In-person).
  """
  workSetting: String

  """
  Filter by company size (e.g. S, M, L).
  """
  companySize: String
}

input CreateSalaryRecordInput {
  """
  The salary amount. Must be a positive number.
  """
  salary: Float!

  """
  Which dataset this record belongs to (e.g. jobs_in_data, salary_extra, software_pro).
  """
  source: String!

  """
  Salary converted to USD (optional).
  """
  salaryInUsd: Float

  """
  Original currency code (e.g. USD, EUR, GBP).
  """
  salaryCurrency: String

  """
  Year the salary data was collected.
  """
  workYear: Int

  """
  Experience level: SE, MI, EN, or EX.
  """
  experienceLevel: String

  """
  Employment type: FT, PT, CT, or FL.
  """
  employmentType: String

  """
  Work setting: Remote, Hybrid, or In-person.
  """
  workSetting: String

  """
  Company size: S, M, or L.
  """
  companySize: String

  """
  Number of salary responses aggregated into this record.
  """
  salariesReported: Int

  """
  Employment status (optional).
  """
  employmentStatus: String

  """
  The job this record belongs to. Use jobId or jobTitle — not both.
  """
  jobId: ID

  """
  Job title text. Used when jobId is not provided — the API will find or create the matching Job record.
  """
  jobTitle: String

  """
  City name text. Combined with employeeCountryId to find or create the City record.
  """
  cityName: String

  """
  Country where the employee is located (optional).
  """
  employeeCountryId: ID

  """
  Country where the company is located (optional).
  """
  companyCountryId: ID

  """
  The company this record belongs to (optional).
  """
  companyId: ID
}

"""
source is intentionally excluded — a record's data origin cannot be changed after creation.
"""
input UpdateSalaryRecordInput {
  """
  Updated salary amount.
  """
  salary: Float

  """
  Updated USD salary.
  """
  salaryInUsd: Float

  """
  Updated currency code.
  """
  salaryCurrency: String

  """
  Updated work year.
  """
  workYear: Int

  """
  Updated experience level: SE, MI, EN, or EX.
  """
  experienceLevel: String

  """
  Updated employment type: FT, PT, CT, or FL.
  """
  employmentType: String

  """
  Updated work setting: Remote, Hybrid, or In-person.
  """
  workSetting: String

  """
  Updated company size: S, M, or L.
  """
  companySize: String

  """
  Updated number of salary responses.
  """
  salariesReported: Int

  """
  Updated employment status.
  """
  employmentStatus: String

  """
  Change the job this record belongs to.
  """
  jobId: ID

  """
  Change the employee country.
  """
  employeeCountryId: ID

  """
  Change the company country.
  """
  companyCountryId: ID

  """
  Change the company.
  """
  companyId: ID
}

type FilterOptions {
  """
  Distinct experience levels present in the matched records.
  """
  experienceLevels: [String!]!

  """
  Distinct work settings present in the matched records.
  """
  workSettings: [String!]!

  """
  Distinct employment types present in the matched records.
  """
  employmentTypes: [String!]!

  """
  Distinct company sizes present in the matched records.
  """
  companySizes: [String!]!

  """
  Distinct work years present in the matched records, sorted descending.
  """
  workYears: [Int!]!
}

extend type Query {
  """
  Returns a paginated list of salary records.
  """
  salaryRecords(filters: SalaryRecordFilters): SalaryRecordPage!

  """
  Returns a single salary record by its numeric ID.
  """
  salaryRecord(id: ID!): SalaryRecord!

  """
  Returns the distinct filter values available for a given country or city.
  Pass neither to get global distinct values.
  """
  filterOptions(countryId: ID, cityId: ID): FilterOptions!

  """
  Full-text search across salary records using Elasticsearch.
  Returns records matching the query with fuzzy matching and highlights.
  """
  searchRecords(query: String!, limit: Int, offset: Int): SearchResultPage!
}

type SearchResult {
  id: ID!
  jobTitle: String
  jobCategory: String
  salary: Float
  salaryInUsd: Float
  country: String
  countryId: ID
  city: String
  cityId: ID
  companyName: String
  experienceLevel: String
  workSetting: String
  workYear: Int
  source: String
  score: Float
}

type SearchResultPage {
  records: [SearchResult!]!
  totalCount: Int!
  hasNextPage: Boolean!
}

extend type Mutation {
  """
  Creates a new salary record.
  Requires authentication.
  """
  createSalaryRecord(input: CreateSalaryRecordInput!): SalaryRecord!

  """
  Updates an existing salary record by ID.
  Requires authentication.
  """
  updateSalaryRecord(id: ID!, input: UpdateSalaryRecordInput!): SalaryRecord!

  """
  Deletes a salary record by ID. Returns true on success.
  Requires authentication.
  """
  deleteSalaryRecord(id: ID!): Boolean!
}
